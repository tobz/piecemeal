[tools]
"cargo:cargo-binstall" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-nextest" = "latest"
"aqua:protoc" = "33.2"

[tasks.build]
description = "Build all workspace crates"
run = "cargo build --workspace"

[tasks.test]
description = "Run all tests"
run = "cargo nextest run --workspace"

[tasks.fmt]
description = "Format code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check code formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run clippy"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.coverage]
description = "Generate code coverage report"
run = "cargo llvm-cov --workspace --codecov --output-path codecov.json"

[tasks.check]
description = "Run all checks (fmt, lint, test)"
depends = ["fmt:check", "lint", "test"]

[tasks.bench]
description = "Run benchmarks"
run = "cargo bench --package piecemeal"

[tasks.codegen]
description = "Generate code from proto files"
run = "cargo run --package piecemeal-build --example generate_docs"

[tasks."codegen:check"]
description = "Check that generated code is up to date"
run = """
cargo run --package piecemeal-build --example generate_docs
git diff --exit-code piecemeal/src/docs/generated/
"""
