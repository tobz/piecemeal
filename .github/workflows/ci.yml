name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@375d3fe4abf5d50515f5bb8dddf2a6cacfe82eb3

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Build
              run: mise run build

            - name: Run tests
              run: mise run test

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@375d3fe4abf5d50515f5bb8dddf2a6cacfe82eb3

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Clippy
              run: mise run lint

    fmt:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@375d3fe4abf5d50515f5bb8dddf2a6cacfe82eb3

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Check formatting
              run: mise run fmt:check

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@375d3fe4abf5d50515f5bb8dddf2a6cacfe82eb3

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Generate coverage
              run: mise run coverage

            - name: Upload to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: codecov.json
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}
